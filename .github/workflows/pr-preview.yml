name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  pull-requests: write

# One run per PR; new pushes cancel an in-flight build for the same PR
concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PREVIEW_PATH: pr-${{ github.event.pull_request.number }}
      PREVIEW_URL: https://krishtoautomate.github.io/my-cv/pr-${{ github.event.pull_request.number }}/
    steps:
      - name: Checkout PR commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build with PR preview base path
        env:
          PUBLIC_URL: /my-cv/pr-${{ github.event.pull_request.number }}
        run: npm run build

      - name: Publish preview to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          destination_dir: ${{ env.PREVIEW_PATH }}
          keep_files: true
          commit_message: "preview: deploy ${{ env.PREVIEW_PATH }} from ${{ github.event.pull_request.head.sha }}"

      - name: Comment preview URL on PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pr-preview
          message: |
            🚀 **Preview deployed:** ${{ env.PREVIEW_URL }}

            Built from commit `${{ github.event.pull_request.head.sha }}`. The preview updates automatically on every push.

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Remove preview directory
        run: |
          set -e
          DIR="pr-${PR_NUMBER}"
          if [ -d "$DIR" ]; then
            rm -rf "$DIR"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "preview: remove $DIR (PR closed)"
              git push
            fi
          else
            echo "No preview directory '$DIR' found on gh-pages"
          fi

      - name: Update PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pr-preview
          message: |
            🧹 PR closed — preview at `pr-${{ github.event.pull_request.number }}/` has been removed.
